name: Publicar Painel BRASFELS

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Preparar site público
        run: |
          mkdir -p _site/assets
          cp index.html styles.css app.js remote.js production.js production.css ui-fix.js live-data.js live-data.css partnership-auth.js partnership-auth.css role-permissions.js .nojekyll _site/
          cp assets/step-one-logo.svg assets/brasfels-logo.svg _site/assets/
          sed -i 's#</head>#<link rel="stylesheet" href="production.css?v=5"><link rel="stylesheet" href="live-data.css?v=5"><link rel="stylesheet" href="partnership-auth.css?v=5"></head>#' _site/index.html
          sed -i 's#</body>#<script defer src="remote.js?v=5"></script><script defer src="production.js?v=5"></script><script defer src="ui-fix.js?v=5"></script><script defer src="live-data.js?v=5"></script><script defer src="partnership-auth.js?v=5"></script><script defer src="role-permissions.js?v=5"></script></body>#' _site/index.html

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Enviar artefato
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
