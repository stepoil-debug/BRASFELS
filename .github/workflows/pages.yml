name: Publicar Painel BRASFELS

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Preparar site público
        run: |
          rm -rf _site
          mkdir -p _site
          cp index.html .nojekyll *.css *.js _site/
          cp -R assets _site/assets
          BUILD_VERSION="${GITHUB_SHA::12}"
          sed -i "s/__BUILD_VERSION__/${BUILD_VERSION}/g" _site/index.html

      - name: Gerar logo STEP One oficial transparente
        run: |
          python -m pip install --disable-pip-version-check --quiet pillow
          python - <<'PY'
          from collections import deque
          from io import BytesIO
          from pathlib import Path
          from urllib.request import Request, urlopen
          from PIL import Image

          url = 'https://intranet-stepone.netlify.app/api/branding/step-one-logo.webp?v=20260804-official'
          request = Request(url, headers={'User-Agent': 'BRASFELS-GitHub-Pages/1.0'})
          with urlopen(request, timeout=45) as response:
              image = Image.open(BytesIO(response.read())).convert('RGBA')

          width, height = image.size
          pixels = image.load()
          visited = bytearray(width * height)
          queue = deque()

          def index(x, y):
              return y * width + x

          def is_external_white(x, y):
              red, green, blue, alpha = pixels[x, y]
              return alpha <= 5 or (
                  red >= 232 and green >= 232 and blue >= 232
                  and max(red, green, blue) - min(red, green, blue) <= 18
              )

          def enqueue(x, y):
              position = index(x, y)
              if not visited[position] and is_external_white(x, y):
                  visited[position] = 1
                  queue.append((x, y))

          for x in range(width):
              enqueue(x, 0)
              enqueue(x, height - 1)
          for y in range(height):
              enqueue(0, y)
              enqueue(width - 1, y)

          while queue:
              x, y = queue.popleft()
              pixels[x, y] = (255, 255, 255, 0)
              if x > 0:
                  enqueue(x - 1, y)
              if x + 1 < width:
                  enqueue(x + 1, y)
              if y > 0:
                  enqueue(x, y - 1)
              if y + 1 < height:
                  enqueue(x, y + 1)

          alpha = image.getchannel('A')
          bounds = alpha.getbbox()
          if not bounds:
              raise RuntimeError('A logo oficial ficou vazia durante a remoção do fundo.')

          margin = 12
          left = max(0, bounds[0] - margin)
          top = max(0, bounds[1] - margin)
          right = min(width, bounds[2] + margin)
          bottom = min(height, bounds[3] + margin)
          image = image.crop((left, top, right, bottom))

          output = Path('_site/assets/step-one-official-transparent.png')
          image.save(output, 'PNG', optimize=True)
          print(f'Logo transparente gerada: {image.size[0]}x{image.size[1]}')
          PY

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Enviar artefato
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
