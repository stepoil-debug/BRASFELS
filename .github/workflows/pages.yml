name: Publicar Painel BRASFELS

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Preparar site público
        run: |
          rm -rf _site
          mkdir -p _site
          cp index.html .nojekyll *.css *.js _site/
          cp -R assets _site/assets
          BUILD_VERSION="${GITHUB_SHA::12}"
          sed -i "s/__BUILD_VERSION__/${BUILD_VERSION}/g" _site/index.html

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Enviar artefato
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
